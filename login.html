<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Gestión 360 ERP</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <main class="login-wrapper">
        <div class="login-brand">
            <img src="img/logo.png" alt="Gestión 360 Logo" class="brand-logo">
        </div>

        <div class="login-form-container">
            <header class="login-header">
                <h2>Bienvenido</h2>
                <p>Ingresa tus credenciales para acceder al sistema</p>
            </header>

            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="username">Usuario o Correo</label>
                    <input type="text" id="username" name="username" placeholder="ejemplo@empresa.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="form-actions">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember"> Recordarme
                    </label>
                    <a href="#" class="forgot-link">¿Olvidaste tu clave?</a>
                </div>

                <button type="submit" class="btn-submit">Ingresar al ERP</button>
            </form>
        </div>
    </main>

    <script src="js/main.js"></script>

</body>
</html>
