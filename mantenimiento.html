<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema en Mantenimiento - Gestión 360 ERP</title>
    <link rel="stylesheet" href="css/mantenimiento.css">
</head>
<body>

    <main class="maintenance-wrapper">
        <div class="maintenance-card">
            <div class="brand-container">
                <img src="img/logo.png" alt="Gestión 360 Logo" class="brand-logo">
            </div>

            <div class="icon-container">
                <div class="icon-circle">
                    🛠️
                </div>
            </div>

            <header class="maintenance-header">
                <h2>Estamos realizando mejoras</h2>
                <p>En este momento <strong>Gestión 360 ERP</strong> se encuentra en mantenimiento programado para optimizar el rendimiento y la seguridad del sistema.</p>
            </header>

            <div class="time-box">
                <span class="time-title">⏱️ Tiempo estimado de retorno:</span>
                <span class="time-value">30 a 45 minutos</span>
            </div>

            <button class="btn-submit" onclick="window.location.reload();">
                🔄 Reintentar Conexión
            </button>

            <footer class="maintenance-footer">
                <p>Si necesitas asistencia urgente, contacta a soporte en <a href="mailto:soporte@gestion360.com">soporte@gestion360.com</a></p>
            </footer>
        </div>
    </main>

    <script src="js/main.js"></script>

</body>
</html>
