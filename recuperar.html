<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Gestión 360 ERP</title>
    <link rel="stylesheet" href="css/recuperar.css">
</head>
<body>

    <main class="recovery-wrapper">
        <div class="recovery-card">
            <!-- Logotipo de la marca -->
            <div class="brand-container">
                <img src="img/logo.png" alt="Gestión 360 Logo" class="brand-logo">
            </div>

            <header class="recovery-header">
                <h2>¿Olvidaste tu contraseña?</h2>
                <p>Ingresa tu correo electrónico registrado y te enviaremos las instrucciones para restablecer tu acceso.</p>
            </header>

            <form action="/recuperar-password" method="POST">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@empresa.com" required>
                </div>

                <button type="submit" class="btn-submit">Enviar Instrucciones</button>
            </form>

            <footer class="recovery-footer">
                <a href="login.html" class="back-link">← Volver al inicio de sesión</a>
            </footer>
        </div>
    </main>

    <script src="js/main.js"></script>

</body>
</html>
